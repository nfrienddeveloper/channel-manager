<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--FONTS-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body {
    --u: calc(min(var(--W), var(--H)) / 100);
    font-family: var(--body-font), 'Liberation Sans', 'DejaVu Sans', sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .scene { position: absolute; inset: 0; overflow: hidden; display: none; }
  .fill { position: absolute; inset: 0; }
  .bgimg { position: absolute; inset: -2%; width: 104%; height: 104%; object-fit: cover; will-change: transform; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.05) 35%, rgba(0,0,0,.55) 70%, rgba(0,0,0,.82) 100%); }
  .content { position: absolute; left: calc(var(--u) * 7); right: calc(var(--u) * 7); top: var(--safeTop); bottom: var(--safeBottom); display: flex; flex-direction: column; justify-content: center; }
  .h { font-family: var(--head-font), 'Liberation Sans', sans-serif; font-weight: 800; line-height: 1.04; letter-spacing: -0.02em; }
  .word { display: inline-block; margin-right: .22em; }
  .kicker { align-self: flex-start; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: calc(var(--u) * 3.4); padding: .45em .9em; border-radius: 999px; background: var(--accent); color: var(--on-accent); margin-bottom: calc(var(--u) * 4); }
  .sub { font-size: calc(var(--u) * 4.6); line-height: 1.3; margin-top: calc(var(--u) * 3.5); font-weight: 500; opacity: .92; }
  .bar { width: calc(var(--u) * 14); height: calc(var(--u) * 1.4); background: var(--accent); border-radius: 99px; margin-bottom: calc(var(--u) * 4); }
  .card { background: var(--primary); color: var(--on-primary); border-radius: calc(var(--u) * 3); padding: calc(var(--u) * 5) calc(var(--u) * 6); box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 6) rgba(0,0,0,.35); }
  .logo-bug { position: absolute; top: calc(var(--u) * 5); left: calc(var(--u) * 6); height: calc(var(--u) * 11); padding: calc(var(--u) * 1.6) calc(var(--u) * 2.6); background: rgba(255,255,255,.94); border-radius: calc(var(--u) * 2); display: flex; align-items: center; z-index: 20; }
  .logo-bug img { height: 100%; width: auto; max-width: calc(var(--u) * 40); object-fit: contain; }
  .pattern { position: absolute; border-radius: 50%; opacity: .16; background: var(--on-primary); }
  .stat-num { font-family: var(--head-font), sans-serif; font-weight: 900; line-height: .95; letter-spacing: -0.04em; font-size: calc(var(--u) * 30); }
  .stat-label { font-size: calc(var(--u) * 6); font-weight: 700; line-height: 1.2; margin-top: calc(var(--u) * 3); }
  .quote-mark { font-family: Georgia, serif; font-size: calc(var(--u) * 36); line-height: .7; color: var(--accent); height: calc(var(--u) * 16); }
  .quote-text { font-family: var(--head-font), sans-serif; font-weight: 700; font-size: calc(var(--u) * 8); line-height: 1.2; }
  .quote-author { margin-top: calc(var(--u) * 5); font-size: calc(var(--u) * 4.2); font-weight: 600; opacity: .8; }
  .list-item { display: flex; align-items: center; gap: calc(var(--u) * 3.5); font-size: calc(var(--u) * 5.8); font-weight: 700; line-height: 1.2; margin-top: calc(var(--u) * 4.5); }
  .tick { flex: none; width: calc(var(--u) * 8); height: calc(var(--u) * 8); border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-size: calc(var(--u) * 5); font-weight: 900; }
  .split-body { position: absolute; left: 0; right: 0; top: 0; height: var(--splitAt); background: var(--primary); color: var(--on-primary); }
  .split-img { position: absolute; left: 0; right: 0; bottom: 0; top: var(--splitAt); overflow: hidden; }
  .split-body .content { top: var(--safeTop); bottom: calc(var(--u) * 6); }
  .landscape .split-body { height: auto; bottom: 0; right: 50%; }
  .landscape .split-img { top: 0; left: 50%; }
  .cta-logo { background: #fff; border-radius: calc(var(--u) * 3); padding: calc(var(--u) * 3) calc(var(--u) * 4.5); align-self: center; margin-bottom: calc(var(--u) * 7); display: flex; }
  .cta-logo img { height: calc(var(--u) * 16); max-width: calc(var(--u) * 70); object-fit: contain; }
  .btn { align-self: center; margin-top: calc(var(--u) * 7); background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: calc(var(--u) * 6); padding: .55em 1.4em; border-radius: 999px; box-shadow: 0 calc(var(--u) * 1.5) calc(var(--u) * 4) rgba(0,0,0,.3); }
  .url { align-self: center; margin-top: calc(var(--u) * 4.5); font-size: calc(var(--u) * 4.6); font-weight: 600; opacity: .9; letter-spacing: .02em; }
  #captions { position: absolute; left: calc(var(--u) * 6); right: calc(var(--u) * 6); top: var(--capTop); z-index: 30; text-align: center; pointer-events: none; }
  #captions span.cap { display: inline; font-family: var(--head-font), sans-serif; font-weight: 800; font-size: calc(var(--u) * 5.6); line-height: 1.45; color: #fff; background: rgba(0,0,0,.72); padding: .12em .35em; border-radius: .25em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  #captions b { color: var(--cap-hi); font-weight: 800; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="captions"></div>
<script>
const D = window.__DATA__;
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeBack = x => { const c = 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

// Brand colours and readable text on top of them.
function lum(hex) {
  const m = hex.replace('#', '').match(/.{2}/g).map(h => parseInt(h, 16) / 255).map(c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4));
  return .2126 * m[0] + .7152 * m[1] + .0722 * m[2];
}
const on = hex => lum(hex) > .45 ? '#111418' : '#ffffff';
const b = D.brand, C = b.colors;
const root = document.body.style;
root.setProperty('--W', D.width + 'px'); root.setProperty('--H', D.height + 'px');
root.setProperty('--primary', C.primary); root.setProperty('--on-primary', on(C.primary));
root.setProperty('--accent', C.accent); root.setProperty('--on-accent', on(C.accent));
root.setProperty('--dark', C.dark); root.setProperty('--light', C.light);
root.setProperty('--head-font', `'${b.fonts.heading}'`); root.setProperty('--body-font', `'${b.fonts.body}'`);
root.setProperty('--cap-hi', lum(C.accent) > .25 ? C.accent : '#FFD84D');
// Safe zones: tall formats keep text clear of platform UI at the top and bottom.
const tall = D.height / D.width > 1.5, portrait = D.height > D.width;
const u = Math.min(D.width, D.height) / 100;
root.setProperty('--safeTop', (tall ? D.height * .14 : u * 14) + 'px');
root.setProperty('--safeBottom', (tall ? D.height * .36 : portrait ? D.height * .22 : D.height * .2) + 'px');
root.setProperty('--splitAt', (tall ? 44 : 50) + '%');
if (!portrait && D.width > D.height) document.body.classList.add('landscape');
root.setProperty('--capTop', (tall ? D.height * .68 : portrait ? D.height * .8 : D.height * .8) + 'px');

const stage = document.getElementById('stage');
const logo = b.logo ? `<div class="logo-bug" data-a="fade" data-d=".2"><img src="${b.logo}"></div>` : '';
const words = (s, d0 = .15, step = .07) => String(s).split(/\s+/).filter(Boolean).map((w, i) => `<span class="word" data-a="rise" data-d="${(d0 + i * step).toFixed(2)}">${esc(w)}</span>`).join('');

function build(s, i) {
  const img = s.image ? `<img class="bgimg" src="${s.image}" style="object-position:${s.focus || 'center 35%'}" data-kb="${i % 2 ? -1 : 1}">` : '';
  const big = n => `font-size:calc(var(--u) * ${n})`;
  switch (s.type) {
    case 'hook': return `<div class="scene" style="background:var(--dark);color:#fff">${img}<div class="shade"></div>${logo}
      <div class="content">${s.kicker ? `<div class="kicker" data-a="pop" data-d=".05">${esc(s.kicker)}</div>` : ''}
      <div class="h" style="${big(s.size || 11.5)}">${words(s.text)}</div>${s.sub ? `<div class="sub" data-a="rise" data-d=".7">${esc(s.sub)}</div>` : ''}</div></div>`;
    case 'image': return `<div class="scene" style="background:var(--dark)">${img}<div class="shade" style="opacity:.8"></div>${logo}
      <div class="content" style="justify-content:flex-end"><div class="card" data-a="slideL" data-d=".25"><div class="bar" style="background:var(--accent)"></div>
      <div class="h" style="${big(s.size || 7.6)}">${esc(s.text)}</div>${s.sub ? `<div class="sub" style="${big(4.2)}">${esc(s.sub)}</div>` : ''}</div></div></div>`;
    case 'stat': return `<div class="scene" style="background:var(--primary);color:var(--on-primary)">
      <div class="pattern" style="width:${u * 90}px;height:${u * 90}px;right:${-u * 30}px;top:${-u * 20}px" data-a="grow" data-d="0"></div>
      <div class="pattern" style="width:${u * 50}px;height:${u * 50}px;left:${-u * 18}px;bottom:${u * 10}px;opacity:.1" data-a="grow" data-d=".1"></div>${logo}
      <div class="content">${s.kicker ? `<div class="kicker" data-a="pop" data-d=".05">${esc(s.kicker)}</div>` : ''}
      <div class="stat-num" data-count="${esc(s.value)}" data-a="pop" data-d=".1">${esc(s.value)}</div>
      <div class="stat-label" data-a="rise" data-d=".55">${esc(s.label)}</div></div></div>`;
    case 'quote': return `<div class="scene" style="background:var(--light);color:var(--dark)">${logo}
      <div class="content"><div class="quote-mark" data-a="pop" data-d=".05">&ldquo;</div>
      <div class="quote-text" data-a="rise" data-d=".25">${esc(s.text)}</div>${s.author ? `<div class="quote-author" data-a="fade" data-d=".8">${esc(s.author)}</div>` : ''}</div></div>`;
    case 'list': return `<div class="scene" style="background:var(--dark);color:#fff">${img ? img + '<div class="shade" style="background:rgba(0,0,0,.7)"></div>' : ''}${logo}
      <div class="content"><div class="bar" data-a="wipe" data-d=".05"></div><div class="h" style="${big(s.size || 8.5)}" data-a="rise" data-d=".1">${esc(s.title)}</div>
      ${(s.items || []).map((t, k) => `<div class="list-item" data-a="slideL" data-d="${(.5 + k * .45).toFixed(2)}"><span class="tick">&#10003;</span><span>${esc(t)}</span></div>`).join('')}</div></div>`;
    case 'split': return `<div class="scene" style="background:var(--primary)"><div class="split-img">${img}</div>
      <div class="split-body"><div class="content"><div class="bar" data-a="wipe" data-d=".1"></div><div class="h" style="${big(s.size || 9)}">${words(s.text, .2)}</div>
      ${s.sub ? `<div class="sub" data-a="rise" data-d=".7">${esc(s.sub)}</div>` : ''}</div></div>${logo}</div>`;
    case 'cta': return `<div class="scene" style="background:var(--primary);color:var(--on-primary)">
      <div class="pattern" style="width:${u * 110}px;height:${u * 110}px;left:${-u * 40}px;top:${-u * 40}px;opacity:.1" data-a="grow" data-d="0"></div>
      <div class="content" style="text-align:center">${b.logo ? `<div class="cta-logo" data-a="pop" data-d=".05"><img src="${b.logo}"></div>` : ''}
      <div class="h" style="${big(s.size || 10)}">${words(s.text, .3)}</div>${s.sub ? `<div class="sub" data-a="rise" data-d=".8">${esc(s.sub)}</div>` : ''}
      ${s.button ? `<div class="btn" data-a="pop" data-d="1.0" data-pulse="1">${esc(s.button)}</div>` : ''}${s.url ? `<div class="url" data-a="fade" data-d="1.3">${esc(s.url)}</div>` : ''}</div></div>`;
    default: throw new Error('Unknown scene type ' + s.type);
  }
}

const scenes = D.scenes.map((s, i) => { const el = $(build(s, i)); stage.appendChild(el); return { s, el, anims: [...el.querySelectorAll('[data-a]')], kb: el.querySelector('.bgimg'), count: el.querySelector('[data-count]'), pulse: el.querySelector('[data-pulse]') }; });
const X = D.transition;

function animate(el, kind, p) {
  const e = easeOut(p);
  const st = el.style;
  st.opacity = kind === 'grow' ? '' : e;
  switch (kind) {
    case 'rise': st.transform = `translateY(${(1 - e) * 0.9}em)`; break;
    case 'slideL': st.transform = `translateX(${(1 - e) * -40}%)`; break;
    case 'pop': st.transform = `scale(${0.6 + 0.4 * easeBack(p)})`; break;
    case 'wipe': st.transform = `scaleX(${e})`; st.transformOrigin = 'left'; break;
    case 'grow': st.transform = `scale(${0.4 + 0.6 * e})`; break;
    default: break;
  }
}

function countText(target, p) {
  const m = String(target).match(/^(\D*)([\d,]+(?:\.\d+)?)(.*)$/);
  if (!m) return target;
  const n = parseFloat(m[2].replace(/,/g, '')), dec = (m[2].split('.')[1] || '').length;
  const v = n * easeOut(p);
  const s = dec ? v.toFixed(dec) : Math.round(v).toLocaleString('en-US');
  return m[1] + (m[2].includes(',') ? s : s.replace(/,/g, '')) + m[3];
}

const capEl = document.getElementById('captions');
window.__seek = (t) => {
  for (const sc of scenes) {
    const { start, end } = sc.s._t;
    const visible = t >= start - X && t < end + (sc === scenes.at(-1) ? 1 : 0);
    sc.el.style.display = visible ? 'block' : 'none';
    if (!visible) continue;
    const lt = t - start;
    sc.el.style.opacity = start === 0 ? 1 : clamp((t - (start - X)) / X);
    for (const a of sc.anims) animate(a, a.dataset.a, clamp((lt - parseFloat(a.dataset.d || 0)) / 0.55));
    if (sc.kb) { const p = clamp((t - start + X) / (end - start + X)); const dir = +sc.kb.dataset.kb; sc.kb.style.transform = `scale(${1.04 + 0.1 * p}) translate(${dir * (p - .5) * 2.4}%, ${(p - .5) * -1.2}%)`; }
    if (sc.count) sc.count.textContent = countText(sc.count.dataset.count, clamp((lt - 0.1) / 1.3));
    if (sc.pulse && lt > 1.6) sc.pulse.style.transform = `scale(${1 + 0.045 * Math.sin((lt - 1.6) * 5)})`;
  }
  // Captions: phrase groups, current word highlighted.
  let html = '';
  if (D.captions) for (const c of D.cues) {
    if (t < c.start || t >= c.end) continue;
    const g = c.groups.find(g => t >= g.start && t < g.end) || null;
    if (!g) break;
    html = '<span class="cap">' + g.words.map(w => t >= w.start && t < w.end ? `<b>${esc(w.text)}</b>` : esc(w.text)).join(' ') + '</span>';
    break;
  }
  if (capEl.innerHTML !== html) capEl.innerHTML = html;
};
window.__ready = (async () => {
  await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 8000))]);
  await Promise.all([...document.images].map(img => img.complete ? 0 : new Promise(r => { img.onload = img.onerror = r; })));
  window.__seek(0);
  return true;
})();
</script>
</body>
</html>
